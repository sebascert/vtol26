[env:f405_wing_v2]
platform = ststm32
board = genericSTM32F405RG
framework = arduino

monitor_speed = 115200
upload_protocol = dfu

upload_flags =
    -s 0x08000000:force:leave

lib_deps =
    finani/ICM42688@^1.1.0
    mikalhart/TinyGPSPlus@^1.0.3
    mprograms/QMC5883LCompass@^1.1.0

build_flags =
    -std=gnu++17
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D_GLIBCXX_USE_CXX11_ABI=1
    -Os
    -fno-exceptions
    -D PIN_WIRE_SDA=PB11
    -D PIN_WIRE_SCL=PB10
    -D HAL_I2C_MODULE_ENABLED

