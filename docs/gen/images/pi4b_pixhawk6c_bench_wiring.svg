<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
<title id="title">Raspberry Pi 4B to Pixhawk 6C: existing cable and missing connections</title>
<desc id="desc">The existing TELEM2 lead requires a matching breakout and three female-to-female GPIO jumper wires. Pixhawk pin 2 TX connects to Pi physical pin 10 RX; pin 3 RX to Pi physical pin 8 TX; pin 6 ground to Pi physical pin 6 ground. Power the Pi separately through USB-C; laptop USB powers and communicates with the Pixhawk. TELEM2 pins 1, 4 and 5 are not connected to the Pi.</desc>
<defs>
  <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
  <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#c45d0b"/></marker>
  <style>
    text {font-family:DejaVu Sans,sans-serif;fill:#18283b}
    .heading {font-size:29px;font-weight:bold}
    .sub {font-size:21px;fill:#475569}
    .label {font-size:23px;font-weight:bold}
    .small {font-size:19px}
    .tiny {font-size:17px;fill:#475569}
    .missing {fill:#a34407;font-weight:bold}
  </style>
</defs>
<rect width="1700" height="1200" fill="#f4f7fb"/>
<text x="60" y="65" font-size="38" font-weight="bold">Pi 4B + Pixhawk 6C — bench connection</text>
<text x="60" y="103" class="sub">Based on your 13:55 photo · Numbers identify connector contacts, not a photo orientation.</text>
<path d="M65 135 H125" stroke="#2563eb" stroke-width="5"/>
<text x="140" y="142" class="small">Solid: cable present / identified</text>
<path d="M620 135 H680" stroke="#c45d0b" stroke-width="5" stroke-dasharray="11 8"/>
<text x="695" y="142" class="small">Dashed: connection to add or reconnect</text>

<!-- Separate bench power paths -->
<rect x="60" y="175" width="420" height="105" rx="16" fill="#fff" stroke="#b7c4d5" stroke-width="2"/>
<text x="86" y="214" class="label">Laptop / QGroundControl</text>
<text x="86" y="250" class="small">Pixhawk USB link not visible in new photo</text>
<path d="M270 282 V345" stroke="#c45d0b" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#orange-arrow)"/>
<text x="300" y="317" class="small" style="fill:#a34407;font-weight:bold">USB DATA + POWER</text>

<rect x="1180" y="175" width="460" height="105" rx="16" fill="#fff" stroke="#b7c4d5" stroke-width="2"/>
<text x="1204" y="214" class="label">Separate Pi USB-C supply</text>
<text x="1204" y="250" class="small">Verify 5 V / 3 A output; rating unreadable</text>
<path d="M1410 282 V345" stroke="#2563eb" stroke-width="4" marker-end="url(#blue-arrow)"/>
<text x="1440" y="317" class="small">Cable seen on Pi</text>

<polygon points="260,332 280,332 270,347" fill="#c45d0b"/>
<polygon points="1400,332 1420,332 1410,347" fill="#2563eb"/>
<!-- Flight controller -->
<rect x="60" y="355" width="420" height="375" rx="20" fill="#fff" stroke="#273b53" stroke-width="3"/>
<text x="88" y="400" class="heading">PIXHAWK 6C</text>
<text x="88" y="431" class="sub">TELEM2 — connector in your photo</text>
<text x="88" y="479" class="label">2 · TX output</text>
<text x="88" y="549" class="label">3 · RX input</text>
<text x="88" y="619" class="label">6 · GND</text>
<circle cx="480" cy="470" r="7" fill="#7c3aed"/>
<circle cx="480" cy="540" r="7" fill="#13815e"/>
<circle cx="480" cy="610" r="7" fill="#334155"/>
<text x="88" y="672" class="small" style="fill:#a34407;font-weight:bold">1 (+5 V), 4 (CTS), 5 (RTS):</text>
<text x="88" y="702" class="small" style="fill:#a34407;font-weight:bold">DO NOT connect these to the Pi.</text>

<!-- Existing lead and required mating adapter -->
<text x="496" y="388" class="tiny">Existing</text>
<text x="496" y="412" class="tiny">6-pin lead</text>
<path d="M488 470 H650" stroke="#7c3aed" stroke-width="5"/>
<path d="M488 540 H650" stroke="#13815e" stroke-width="5"/>
<path d="M488 610 H650" stroke="#334155" stroke-width="5"/>
<rect x="650" y="355" width="350" height="375" rx="20" fill="#fff8ec" stroke="#c45d0b" stroke-width="3" stroke-dasharray="12 8"/>
<text x="675" y="400" class="heading" style="fill:#a34407;font-weight:bold">ADD / MISSING</text>
<text x="675" y="432" class="small">Matching 6-pin JST-GH breakout</text>
<circle cx="670" cy="470" r="7" fill="#7c3aed"/><text x="693" y="478" class="label">Contact 2</text>
<circle cx="670" cy="540" r="7" fill="#13815e"/><text x="693" y="548" class="label">Contact 3</text>
<circle cx="670" cy="610" r="7" fill="#334155"/><text x="693" y="618" class="label">Contact 6</text>
<text x="675" y="674" class="small">Held white plug mates here.</text>
<text x="675" y="702" class="small">It cannot plug onto Pi GPIO.</text>

<!-- Required female-female jumpers -->
<text x="1018" y="386" class="tiny" style="fill:#a34407;font-weight:bold">ADD 3 GPIO</text>
<text x="1018" y="411" class="tiny" style="fill:#a34407;font-weight:bold">jumper wires</text>
<text x="1018" y="436" class="tiny">female–female</text>
<path d="M1000 470 H1180" stroke="#7c3aed" stroke-width="5" stroke-dasharray="12 8"/>
<path d="M1000 540 H1180" stroke="#13815e" stroke-width="5" stroke-dasharray="12 8"/>
<path d="M1000 610 H1180" stroke="#334155" stroke-width="5" stroke-dasharray="12 8"/>
<text x="1020" y="670" class="tiny">2.54 mm</text>
<text x="1020" y="695" class="tiny">insulated ends</text>

<!-- Raspberry Pi -->
<rect x="1180" y="355" width="460" height="375" rx="20" fill="#edf9f3" stroke="#267453" stroke-width="3"/>
<text x="1206" y="400" class="heading">RASPBERRY PI 4B</text>
<text x="1206" y="431" class="sub">40-pin header · PHYSICAL pin numbers</text>
<circle cx="1180" cy="470" r="7" fill="#7c3aed"/>
<text x="1206" y="479" class="label">10 · RXD / GPIO15</text>
<circle cx="1180" cy="540" r="7" fill="#13815e"/>
<text x="1206" y="549" class="label">8 · TXD / GPIO14</text>
<circle cx="1180" cy="610" r="7" fill="#334155"/>
<text x="1206" y="619" class="label">6 · GND</text>
<text x="1206" y="674" class="small">3.3 V UART · /dev/serial0</text>
<text x="1206" y="702" class="small">57600 baud · 8N1 · no flow control</text>

<!-- Buying/adaptation summary -->
<rect x="60" y="775" width="940" height="290" rx="18" fill="#fff" stroke="#b7c4d5" stroke-width="2"/>
<text x="86" y="818" class="heading">What you need to complete the link</text>
<text x="86" y="862" class="small">A. Reuse the pictured lead: matching 6-pin breakout + 3 female–female jumpers.</text>
<text x="86" y="900" class="small">OR replace that lead with a TELEM2-to-female-GPIO harness (3 active wires).</text>
<text x="86" y="947" class="small">B. Connect a USB DATA cable from laptop to the Pixhawk's actual USB port.</text>
<text x="86" y="980" class="small">The previously shown cable may cover B; it is not visible connected here.</text>
<text x="86" y="1027" class="small" style="fill:#a34407;font-weight:bold">Verify every wire by contact number. Colours do not prove the pin mapping.</text>

<!-- Numbered Pi header reference -->
<rect x="1040" y="775" width="600" height="290" rx="18" fill="#fff" stroke="#b7c4d5" stroke-width="2"/>
<text x="1066" y="815" class="label">Pi header: first 5 rows (schematic)</text>
<text x="1066" y="846" class="tiny">Pin-1 end is away from USB-A / Ethernet sockets.</text>
<g class="small" text-anchor="middle">
<circle cx="1140" cy="879" r="10" fill="#cbd5e1"/><text x="1102" y="886">1</text>
<circle cx="1230" cy="879" r="10" fill="#cbd5e1"/><text x="1265" y="886">2</text>
<circle cx="1140" cy="915" r="10" fill="#cbd5e1"/><text x="1102" y="922">3</text>
<circle cx="1230" cy="915" r="10" fill="#cbd5e1"/><text x="1265" y="922">4</text>
<circle cx="1140" cy="951" r="10" fill="#cbd5e1"/><text x="1102" y="958">5</text>
<circle cx="1230" cy="951" r="10" fill="#334155"/><text x="1265" y="958">6</text>
<circle cx="1140" cy="987" r="10" fill="#cbd5e1"/><text x="1102" y="994">7</text>
<circle cx="1230" cy="987" r="10" fill="#13815e"/><text x="1265" y="994">8</text>
<circle cx="1140" cy="1023" r="10" fill="#cbd5e1"/><text x="1102" y="1030">9</text>
<circle cx="1230" cy="1023" r="10" fill="#7c3aed"/><text x="1265" y="1030">10</text>
</g>
<text x="1310" y="958" class="small">GND to TELEM2 6</text>
<text x="1310" y="994" class="small">TX to TELEM2 3</text>
<text x="1310" y="1030" class="small">RX from TELEM2 2</text>

<text x="60" y="1110" class="label" style="fill:#a34407;font-weight:bold">Wire with both units unpowered. Leave TELEM2 +5 V isolated. Keep actuator power disconnected.</text>
<text x="60" y="1147" class="small">Schematic, not a trace of the loose cable: verify continuity and connector orientation before powering up.</text>
<text x="60" y="1180" class="tiny">Pinout: docs.holybro.com/autopilot/pixhawk-6c/pixhawk-6c-ports · Pi mapping: docs.px4.io/main/en/companion_computer/pixhawk_rpi</text>
</svg>
