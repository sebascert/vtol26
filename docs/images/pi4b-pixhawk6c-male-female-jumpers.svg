<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1110" viewBox="0 0 1780 1110" role="img" aria-labelledby="title desc">
<title id="title">Using male-female jumper wires between Pixhawk 6C and Raspberry Pi 4B</title>
<desc id="desc">Add a matching 6-pin JST-GH breakout with a soldered 2.54 millimetre male header and a solderless breadboard. Put its six header pins in six separate numbered breadboard rows. Three male-female jumpers connect breadboard contacts corresponding to TELEM2 2, 3 and 6 to Pi physical pins 10, 8 and 6. Leave TELEM2 1, 4 and 5 disconnected from the Pi.</desc>
<rect width="1780" height="1110" fill="#f5f7fb" />
<text x="50" y="60" font-family="DejaVu Sans" font-size="36" fill="#172b43" font-weight="bold">Male–female jumpers: possible with a breakout + breadboard</text>
<text x="50" y="100" font-family="DejaVu Sans" font-size="21" fill="#172b43">Jumper male ends go into the breadboard. Jumper female ends go onto the Pi's male GPIO pins.</text>
<text x="50" y="138" font-family="DejaVu Sans" font-size="22" fill="#a34407" font-weight="bold">Do not push 2.54 mm jumper pins into the small white JST-GH plug.</text>

<rect x="50" y="185" width="335" height="535" rx="18" fill="#fff" stroke="#334155" stroke-width="3" />
<text x="75" y="230" font-family="DejaVu Sans" font-size="27" fill="#172b43" font-weight="bold">PIXHAWK 6C</text>
<text x="75" y="264" font-family="DejaVu Sans" font-size="21" fill="#172b43">TELEM2 contact numbers</text>
<text x="75" y="408" font-family="DejaVu Sans" font-size="27" fill="#172b43" font-weight="bold">2 · TX</text>
<text x="75" y="468" font-family="DejaVu Sans" font-size="27" fill="#172b43" font-weight="bold">3 · RX</text>
<text x="75" y="648" font-family="DejaVu Sans" font-size="27" fill="#172b43" font-weight="bold">6 · GND</text>
<text x="75" y="686" font-family="DejaVu Sans" font-size="19" fill="#172b43">Existing white-to-white cable</text>

<rect x="470" y="185" width="325" height="535" rx="18" fill="#fff5e6" stroke="#c45d0b" stroke-width="3" stroke-dasharray="10 7" />
<text x="493" y="230" font-family="DejaVu Sans" font-size="27" fill="#172b43" font-weight="bold">ADD: BREAKOUT</text>
<text x="493" y="264" font-family="DejaVu Sans" font-size="19" fill="#172b43">6-pin JST-GH mating socket</text>
<text x="493" y="302" font-family="DejaVu Sans" font-size="19" fill="#172b43">+ soldered 2.54 mm header</text>
<text x="493" y="686" font-family="DejaVu Sans" font-size="17" fill="#475569">Header contacts shown at right.</text>

<rect x="855" y="185" width="325" height="535" rx="18" fill="#fff5e6" stroke="#c45d0b" stroke-width="3" stroke-dasharray="10 7" />
<text x="875" y="230" font-family="DejaVu Sans" font-size="27" fill="#172b43" font-weight="bold">ADD: BREADBOARD</text>
<text x="875" y="264" font-family="DejaVu Sans" font-size="17" fill="#475569">A–E in one row are connected.</text>
<text x="875" y="292" font-family="DejaVu Sans" font-size="17" fill="#475569">Different rows stay separate.</text>

<rect x="1360" y="185" width="365" height="535" rx="18" fill="#edf9f3" stroke="#267453" stroke-width="3" />
<text x="1380" y="230" font-family="DejaVu Sans" font-size="27" fill="#172b43" font-weight="bold">RASPBERRY PI 4B</text>
<text x="1380" y="264" font-family="DejaVu Sans" font-size="21" fill="#172b43">PHYSICAL GPIO pin numbers</text>
<text x="1380" y="408" font-family="DejaVu Sans" font-size="27" fill="#172b43" font-weight="bold">10 · RX / GPIO15</text>
<text x="1380" y="468" font-family="DejaVu Sans" font-size="27" fill="#172b43" font-weight="bold">8 · TX / GPIO14</text>
<text x="1380" y="648" font-family="DejaVu Sans" font-size="27" fill="#172b43" font-weight="bold">6 · GND</text>
<text x="1380" y="686" font-family="DejaVu Sans" font-size="19" fill="#172b43">Female jumper sockets fit here.</text>

<text x="890" y="320" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#475569">A</text><text x="932" y="320" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#475569">B</text><text x="974" y="320" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#475569">C</text><text x="1016" y="320" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#475569">D</text><text x="1058" y="320" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#475569">E</text><text x="1195" y="304" font-family="DejaVu Sans" font-size="19" fill="#172b43">3 male–female</text>
<text x="1195" y="330" font-family="DejaVu Sans" font-size="19" fill="#172b43">jumper wires</text>
<text x="817" y="347" font-family="DejaVu Sans" font-size="17" fill="#475569">1</text><line x1="760" y1="340" x2="1060" y2="340" stroke="#aab5c5" stroke-width="5" /><circle cx="890" cy="340" r="8" fill="#fff" stroke="#aab5c5" stroke-width="3" /><circle cx="932" cy="340" r="8" fill="#fff" stroke="#aab5c5" stroke-width="3" /><circle cx="974" cy="340" r="8" fill="#fff" stroke="#aab5c5" stroke-width="3" /><circle cx="1016" cy="340" r="8" fill="#fff" stroke="#aab5c5" stroke-width="3" /><circle cx="1058" cy="340" r="8" fill="#fff" stroke="#aab5c5" stroke-width="3" /><rect x="770" y="333" width="20" height="14" fill="#aab5c5" /><text x="493" y="347" font-family="DejaVu Sans" font-size="17" fill="#475569">1 · +5 V: no jumper</text><text x="817" y="407" font-family="DejaVu Sans" font-size="17" fill="#475569">2</text><line x1="760" y1="400" x2="1060" y2="400" stroke="#7c3aed" stroke-width="5" /><circle cx="890" cy="400" r="8" fill="#fff" stroke="#7c3aed" stroke-width="3" /><circle cx="932" cy="400" r="8" fill="#fff" stroke="#7c3aed" stroke-width="3" /><circle cx="974" cy="400" r="8" fill="#fff" stroke="#7c3aed" stroke-width="3" /><circle cx="1016" cy="400" r="8" fill="#fff" stroke="#7c3aed" stroke-width="3" /><circle cx="1058" cy="400" r="8" fill="#fff" stroke="#7c3aed" stroke-width="3" /><rect x="770" y="393" width="20" height="14" fill="#7c3aed" /><text x="493" y="408" font-family="DejaVu Sans" font-size="27" fill="#172b43" font-weight="bold">2 · TX</text><line x1="385" y1="400" x2="470" y2="400" stroke="#7c3aed" stroke-width="5" /><line x1="1058" y1="400" x2="1353" y2="400" stroke="#7c3aed" stroke-width="5" /><rect x="1054" y="389" width="8" height="22" fill="#7c3aed" /><rect x="1342" y="387" width="19" height="26" rx="3" fill="#18283b" /><text x="817" y="467" font-family="DejaVu Sans" font-size="17" fill="#475569">3</text><line x1="760" y1="460" x2="1060" y2="460" stroke="#13815e" stroke-width="5" /><circle cx="890" cy="460" r="8" fill="#fff" stroke="#13815e" stroke-width="3" /><circle cx="932" cy="460" r="8" fill="#fff" stroke="#13815e" stroke-width="3" /><circle cx="974" cy="460" r="8" fill="#fff" stroke="#13815e" stroke-width="3" /><circle cx="1016" cy="460" r="8" fill="#fff" stroke="#13815e" stroke-width="3" /><circle cx="1058" cy="460" r="8" fill="#fff" stroke="#13815e" stroke-width="3" /><rect x="770" y="453" width="20" height="14" fill="#13815e" /><text x="493" y="468" font-family="DejaVu Sans" font-size="27" fill="#172b43" font-weight="bold">3 · RX</text><line x1="385" y1="460" x2="470" y2="460" stroke="#13815e" stroke-width="5" /><line x1="1058" y1="460" x2="1353" y2="460" stroke="#13815e" stroke-width="5" /><rect x="1054" y="449" width="8" height="22" fill="#13815e" /><rect x="1342" y="447" width="19" height="26" rx="3" fill="#18283b" /><text x="817" y="527" font-family="DejaVu Sans" font-size="17" fill="#475569">4</text><line x1="760" y1="520" x2="1060" y2="520" stroke="#aab5c5" stroke-width="5" /><circle cx="890" cy="520" r="8" fill="#fff" stroke="#aab5c5" stroke-width="3" /><circle cx="932" cy="520" r="8" fill="#fff" stroke="#aab5c5" stroke-width="3" /><circle cx="974" cy="520" r="8" fill="#fff" stroke="#aab5c5" stroke-width="3" /><circle cx="1016" cy="520" r="8" fill="#fff" stroke="#aab5c5" stroke-width="3" /><circle cx="1058" cy="520" r="8" fill="#fff" stroke="#aab5c5" stroke-width="3" /><rect x="770" y="513" width="20" height="14" fill="#aab5c5" /><text x="493" y="527" font-family="DejaVu Sans" font-size="17" fill="#475569">4 · CTS: no jumper</text><text x="817" y="587" font-family="DejaVu Sans" font-size="17" fill="#475569">5</text><line x1="760" y1="580" x2="1060" y2="580" stroke="#aab5c5" stroke-width="5" /><circle cx="890" cy="580" r="8" fill="#fff" stroke="#aab5c5" stroke-width="3" /><circle cx="932" cy="580" r="8" fill="#fff" stroke="#aab5c5" stroke-width="3" /><circle cx="974" cy="580" r="8" fill="#fff" stroke="#aab5c5" stroke-width="3" /><circle cx="1016" cy="580" r="8" fill="#fff" stroke="#aab5c5" stroke-width="3" /><circle cx="1058" cy="580" r="8" fill="#fff" stroke="#aab5c5" stroke-width="3" /><rect x="770" y="573" width="20" height="14" fill="#aab5c5" /><text x="493" y="587" font-family="DejaVu Sans" font-size="17" fill="#475569">5 · RTS: no jumper</text><text x="817" y="647" font-family="DejaVu Sans" font-size="17" fill="#475569">6</text><line x1="760" y1="640" x2="1060" y2="640" stroke="#334155" stroke-width="5" /><circle cx="890" cy="640" r="8" fill="#fff" stroke="#334155" stroke-width="3" /><circle cx="932" cy="640" r="8" fill="#fff" stroke="#334155" stroke-width="3" /><circle cx="974" cy="640" r="8" fill="#fff" stroke="#334155" stroke-width="3" /><circle cx="1016" cy="640" r="8" fill="#fff" stroke="#334155" stroke-width="3" /><circle cx="1058" cy="640" r="8" fill="#fff" stroke="#334155" stroke-width="3" /><rect x="770" y="633" width="20" height="14" fill="#334155" /><text x="493" y="648" font-family="DejaVu Sans" font-size="27" fill="#172b43" font-weight="bold">6 · GND</text><line x1="385" y1="640" x2="470" y2="640" stroke="#334155" stroke-width="5" /><line x1="1058" y1="640" x2="1353" y2="640" stroke="#334155" stroke-width="5" /><rect x="1054" y="629" width="8" height="22" fill="#334155" /><rect x="1342" y="627" width="19" height="26" rx="3" fill="#18283b" />
<text x="1235" y="478" font-family="DejaVu Sans" font-size="17" fill="#475569">M end</text>
<text x="1235" y="504" font-family="DejaVu Sans" font-size="17" fill="#475569">at breadboard</text>
<text x="1235" y="555" font-family="DejaVu Sans" font-size="17" fill="#475569">F end</text>
<text x="1235" y="581" font-family="DejaVu Sans" font-size="17" fill="#475569">at Pi</text>
<rect x="50" y="765" width="1675" height="235" rx="18" fill="#fff" stroke="#b7c4d5" stroke-width="2" />
<text x="75" y="807" font-family="DejaVu Sans" font-size="27" fill="#172b43" font-weight="bold">Physical assembly</text>
<text x="75" y="850" font-family="DejaVu Sans" font-size="21" fill="#172b43">1. Plug the held white connector into the matching JST-GH breakout.</text>
<text x="75" y="887" font-family="DejaVu Sans" font-size="21" fill="#172b43">2. Insert its 6-pin male header into A1–A6: ONE contact per numbered row, never all in one joined row.</text>
<text x="75" y="924" font-family="DejaVu Sans" font-size="21" fill="#172b43">3. Put jumper male ends in E2, E3 and E6; put their female ends on Pi pins 10, 8 and 6 respectively.</text>
<text x="75" y="965" font-family="DejaVu Sans" font-size="22" fill="#a34407" font-weight="bold">Example row numbering only. Confirm each breakout header contact against the TELEM2 pinout.</text>
<text x="50" y="1040" font-family="DejaVu Sans" font-size="22" fill="#a34407" font-weight="bold">Power OFF both boards while wiring. Leave +5 V / CTS / RTS disconnected from the Pi. Do not use power rails.</text>
<text x="50" y="1080" font-family="DejaVu Sans" font-size="19" fill="#172b43">Temporary bench arrangement. A correctly wired JST-GH-to-female-GPIO harness avoids the breakout, breadboard and jumpers.</text>
</svg>